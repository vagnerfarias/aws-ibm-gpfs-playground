---
- name: Playbook to set up the iscsi target ec2 in aws
  hosts: localhost
  gather_facts: false
  become: false
  vars_files:
    # Use this to override stuff that won't be committed to git
    - ../overrides.yml
  vars:
    iscsi_pairs:
    - self_name: "{{ iscsi_target_1_name }}"
      self_ip:   "{{ iscsi_target_1_ip }}"
      peer_name: "{{ iscsi_target_2_name }}"
      peer_ip:   "{{ iscsi_target_2_ip }}"
    - self_name: "{{ iscsi_target_2_name }}"
      self_ip:   "{{ iscsi_target_2_ip }}"
      peer_name: "{{ iscsi_target_1_name }}"
      peer_ip:   "{{ iscsi_target_1_ip }}"

  tasks:
    - name: Print AWS infos
      ansible.builtin.debug:
        msg: "Region: {{ ocp_region }} - Cluster: {{ ocp_cluster_name }}.{{ ocp_domain }} - Workers [{{ ocp_worker_count }}]: {{ ocp_worker_type }} - AWS Profile: {{ aws_profile }}"

    - name: Create key pair to access ec2 with ssh
      amazon.aws.ec2_key:
        profile: "{{ aws_profile }}"
        region: "{{ ocp_region }}"
        name: "{{ iscsi_target_ssh_key_name }}"
        key_material: "{{ ssh_pubkey }}"

    - name: Gather security group info for workers
      amazon.aws.ec2_security_group_info:
        profile: "{{ aws_profile }}"
        region: "{{ ocp_region }}"
        filters:
          "tag:sigs.k8s.io/cluster-api-provider-aws/role": "node"
      register: sg_info

    - name: Set vpc and sg id
      ansible.builtin.set_fact:
        sg_vpc_id: "{{ sg_info.security_groups[0].vpc_id }}"
        sg_group_id: "{{ sg_info.security_groups[0].group_id }}"

    - name: Gather vpc info for workers
      amazon.aws.ec2_vpc_subnet_info:
        profile: "{{ aws_profile }}"
        region: "{{ ocp_region }}"
        filters:
          vpc-id: "{{ sg_vpc_id }}"
      register: subnet_info

    - name: Set public subnet id
      ansible.builtin.set_fact: # only add the public subnet, and there will be only exactly one
        public_subnet_id: "{{ subnet_info.subnets |  selectattr('map_public_ip_on_launch', '==', true) | map(attribute='subnet_id') | first }}"

    - name: Get my public IPv4
      ansible.builtin.uri:
        url: https://checkip.amazonaws.com
        return_content: true
      register: myip_v4
      run_once: true

    - name: Create ec2 security group
      amazon.aws.ec2_security_group:
        profile: "{{ aws_profile }}"
        region: "{{ ocp_region }}"
        name: iscsi-target-security-group
        description: sec group for iscsi target ec2
        vpc_id: "{{ sg_vpc_id }}"
        rules:
        - proto: tcp
          ports:
            - 22
          group_id: "{{ sg_group_id }}"
          rule_desc: allow ssh from the ocp workers to debug
        - proto: tcp
          ports:
            - 3260
          group_id: "{{ sg_group_id }}"
          rule_desc: allow iscsi for ocp worker nodes
        - proto: tcp
          ports:
            - 7789
          group_name: iscsi-target-security-group
          rule_desc: allow drbd traffic between iscsi target nodes 
        - proto: tcp
          ports:
            - 22
          cidr_ip: "{{ myip_v4.content | trim }}/32"
          rule_desc: "SSH from my IPv4"

    - name: Start iscsi target instance with EBS
      amazon.aws.ec2_instance:
        profile: "{{ aws_profile }}"
        region: "{{ ocp_region }}"
        name: "{{ item.self_name }}"
        state: started
        wait: true
        vpc_subnet_id: "{{ public_subnet_id }}"
        instance_type: "{{ iscsi_target_instance_type }}"
        key_name: "{{ iscsi_target_ssh_key_name }}"
        security_group: iscsi-target-security-group
        network_interfaces:
          - assign_public_ip: true
            private_ip_addresses:
            - primary: true
              private_ip_address: "{{ item.self_ip }}"
        image_id: "{{ iscsi_target_ami_image_id }}"
        volumes:
          - device_name: /dev/sdb
            ebs:
              volume_size: "{{ iscsi_target_volume_size }}"
              delete_on_termination: true
        user_data: "{{ lookup('template', '../templates/iscsi-ha-user-data.j2') }}"
      loop: "{{ iscsi_pairs }}"
      loop_control:
        label: "{{ item.self_name }}" 
      vars:
        self_name: "{{ item.self_name }}"
        self_ip:   "{{ item.self_ip }}"
        peer_name: "{{ item.peer_name }}"
        peer_ip:   "{{ item.peer_ip }}"
      async: 3600        # run up to 60m in background for each item
      poll: 0            # don't wait here; just fire and continue
      register: launch_async

    # --- Wait for all async launches to finish ------------------------------
    - name: Wait for each async launch to complete
      ansible.builtin.async_status:
        jid: "{{ item.ansible_job_id }}"
      register: launch_wait
      until: launch_wait.finished
      retries: 20       # up to 20 minutes total (240 * 5s)
      delay: 30
      loop: "{{ launch_async.results }}"

    # Gather each job's EC2 instance dict (first in the list), whether it's under result or not
    - name: Collate instance objects from async results
      set_fact:
        instances_all: >-
          {{
            (instances_all | default([]))
            + [ (item.result.instances | default(item.instances) | first) ]
          }}
      loop: "{{ launch_wait.results }}"
      loop_control:
        label: "{{ (item.item.self_name | default(item.ansible_job_id)) }}"

    - name: Add iSCSI targets to inventory
      add_host:
        name: "{{ item.tags.Name | default(item.instance_id) }}"
        groups: iscsi_targets
        ansible_host: "{{ item.public_ip_address }}"
        ansible_user: "{{ iscsi_ha_ssh_user }}"
        ansible_ssh_private_key_file: "{{ iscsi_target_ssh_private_key_file }}"
      loop: "{{ instances_all }}"

    # --- Wait for SSH, then delegate tasks ----------------------------------
    - name: Wait for SSH on each iSCSI target
      wait_for_connection:
        timeout: 300
      delegate_to: "{{ item }}"
      loop: "{{ groups['iscsi_targets'] | default([]) }}"

    - name: Choose primary target (first in group)
      set_fact:
        iscsi_primary: "{{ groups['iscsi_targets'][0] }}"

    - name: DRBD initial setup
      ansible.builtin.command: "/usr/local/sbin/drbd-initial-sync.sh"
      changed_when: false
      delegate_to: "{{ iscsi_primary }}"

    - name: Configure iSCSI target service on both servers
      ansible.builtin.command: "/usr/local/sbin/configure-target.sh"
      become: false
      changed_when: false
      loop: "{{ groups['iscsi_targets'] }}"
      loop_control: { loop_var: target }
      delegate_to: "{{ target }}"

    - name: Start iSCSI target service on both servers
      ansible.builtin.command: "systemctl start target"
      become: true
      changed_when: false
      loop: "{{ groups['iscsi_targets'] }}"
      loop_control: { loop_var: target }
      delegate_to: "{{ target }}"

    # Creates localdisk + filesystem + test environment
    - name: Setup gpfs filesystem
      ansible.builtin.import_tasks: gpfs-iscsi-fs-setup.yml


    - name: Template the test deployment
      tags:
        - test-app
      ansible.builtin.template:
        src: ../templates/test_ha_consume.yaml
        dest: "{{ gpfsfolder }}/test_ha_consume.yaml"

    - name: Apply the test deployment
      tags:
        - test-app
      ansible.builtin.shell: |
        set -ex
        export KUBECONFIG={{ kubeconfig }}
        {{ oc_bin }} apply -f "{{ gpfsfolder }}/test_ha_consume.yaml"
